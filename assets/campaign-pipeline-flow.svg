  <rect class="zone" x="580" y="276" width="184" height="328" rx="10"/>

  <text class="zone-label" x="185" y="52" text-anchor="middle">Brand &amp; SEO track</text>
  <text class="zone-label" x="465" y="52" text-anchor="middle">Research track</text>
  <text class="zone-label" x="266" y="314" text-anchor="middle">Creative &amp; quality</text>
  <text class="zone-label" x="672" y="308" text-anchor="middle">Delivery</text>

  <rect class="n-g" x="342" y="12" width="96" height="28" rx="14"/>
  <text class="pill" x="390" y="30" text-anchor="middle">START</text>
  <line class="edge" x1="390" y1="40" x2="390" y2="50" marker-end="url(#arr)"/>

  <rect class="n-r" x="318" y="52" width="144" height="44" rx="8"/>
