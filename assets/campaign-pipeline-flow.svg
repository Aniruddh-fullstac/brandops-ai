  <text class="sub" x="390" y="345" text-anchor="middle">Ad &amp; copy generation</text>
  <line class="edge" x1="390" y1="354" x2="390" y2="366" marker-end="url(#arr)"/>

  <rect class="n-t" x="318" y="368" width="144" height="44" rx="8"/>
  <text class="title" x="390" y="388" text-anchor="middle">critic</text>
  <text class="sub" x="390" y="403" text-anchor="middle">Quality evaluation</text>

  <path class="edge" d="M 462 390 L 548 390 L 548 286" marker-end="url(#arr)"/>

  <rect class="n-t" x="488" y="286" width="124" height="44" rx="8"/>
