  <text class="sub" x="612" y="402" text-anchor="middle">pass or cap</text>

  <rect class="n-d" x="604" y="424" width="136" height="44" rx="8"/>
  <text class="title" x="672" y="444" text-anchor="middle">post_critic_parallel</text>
  <text class="sub" x="672" y="459" text-anchor="middle">Localize, keywords, timing</text>
  <line class="edge" x1="672" y1="468" x2="672" y2="480" marker-end="url(#arr)"/>

  <rect class="n-d" x="598" y="484" width="148" height="44" rx="8"/>
  <text class="title" x="672" y="504" text-anchor="middle">parallel_schedule_bundle</text>
  <text class="sub" x="672" y="519" text-anchor="middle">Schedule, perf sim, post images</text>
  <line class="edge" x1="672" y1="528" x2="672" y2="538" marker-end="url(#arr)"/>

  <rect class="n-d" x="616" y="542" width="112" height="40" rx="8"/>
  <text class="title" x="672" y="561" text-anchor="middle">finalize</text>
  <text class="sub" x="672" y="574" text-anchor="middle">Bundle artifacts</text>

