<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 628" width="780" height="628" role="img" aria-label="BrandOps AI LangGraph campaign pipeline">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#475569"/>
    </marker>
    <style><![CDATA[
      .bg { fill: #fafafa; }
      .zone { fill: none; stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 5 4; }
      .zone-label { font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64748b; letter-spacing: 0.02em; }
      .edge { fill: none; stroke: #64748b; stroke-width: 1.25; marker-end: url(#arr); }
      .edge-loop { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 5 4; }
      .title { font: 600 12px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .sub { font: 400 10px ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .pill { font: 600 11px ui-sans-serif, system-ui, sans-serif; fill: #1e293b; }
      .n-r { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.2; }
      .n-t { fill: #ecfdf5; stroke: #059669; stroke-width: 1.2; }
      .n-d { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.2; }
      .n-g { fill: #f1f5f9; stroke: #475569; stroke-width: 1.2; }
    ]]></style>
  </defs>

  <rect class="bg" x="0" y="0" width="780" height="628" rx="12"/>

  <rect class="zone" x="16" y="56" width="338" height="252" rx="10"/>
  <rect class="zone" x="360" y="56" width="210" height="252" rx="10"/>
